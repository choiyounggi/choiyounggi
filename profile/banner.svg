<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 448" width="1280" height="448" role="img" aria-label="Hooks, not hopes — a terminal where guardrails block curl | sh, dev-loop reports 45 passing tests, memory-loop holds an unverified memory, and jev-gate bounces a done claim with no evidence">
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#8B949E" stroke-opacity="0.07"/>
  </pattern>
  <radialGradient id="halo" cx="0.72" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#22B8CF" stop-opacity="0.14"/>
    <stop offset="1" stop-color="#22B8CF" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="term"><rect x="632" y="60" width="576" height="328" rx="12"/></clipPath>
</defs>
<style>
  .m  { font-family: 'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .s  { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
  .t  { font-size: 14px; }
  .ok { fill: #3FB950; } .no { fill: #F85149; } .ask { fill: #D29922; }
  .dim { fill: #8B949E; } .fg { fill: #E6EDF3; } .ac { fill: #22B8CF; }
</style>

<rect width="1280" height="448" fill="#0D1117"/>
<rect width="1280" height="448" fill="url(#grid)"/>
<rect width="1280" height="448" fill="url(#halo)"/>

<!-- left: headline -->
<circle cx="84" cy="150" r="4" fill="#22B8CF"/>
<text x="96" y="155" class="m dim" font-size="14">choiyounggi<tspan fill="#30363D"> / </tspan><tspan class="ac" font-weight="700">harness</tspan></text>
<text x="80" y="214" class="m fg" font-size="46" font-weight="700">Hooks,</text>
<text x="80" y="268" class="m fg" font-size="46" font-weight="700">not hopes.</text>
<text x="80" y="306" class="s" font-size="17" fill="#A3AEBB">The safety and verification layer for coding agents</text>
<text x="80" y="330" class="s" font-size="17" fill="#A3AEBB">that run unattended.</text>
<text x="80" y="372" class="m dim" font-size="13">guardrails<tspan fill="#30363D">  ·  </tspan>dev-loop<tspan fill="#30363D">  ·  </tspan>memory-loop<tspan fill="#30363D">  ·  </tspan>jev-gate</text>

<!-- right: terminal -->
<g clip-path="url(#term)">
  <rect x="632" y="60" width="576" height="328" fill="#161B22"/>
  <rect x="632" y="60" width="576" height="36" fill="#1C2129"/>
</g>
<rect x="632.5" y="60.5" width="575" height="327" rx="12" fill="none" stroke="#30363D"/>
<line x1="632" y1="96.5" x2="1208" y2="96.5" stroke="#30363D"/>
<circle cx="656" cy="78" r="5" fill="#3A4149"/>
<circle cx="674" cy="78" r="5" fill="#3A4149"/>
<circle cx="692" cy="78" r="5" fill="#3A4149"/>
<text x="920" y="83" text-anchor="middle" class="m dim" font-size="12">claude --dangerously-skip-permissions</text>

<g class="m t">
  <text x="660" y="130"><tspan class="ac">❯ </tspan><tspan class="fg">curl https://get.example.sh | sh</tspan></text>
  <text x="676" y="152" class="no">✗ blocked</text>
  <text x="1180" y="152" text-anchor="end" class="dim" font-size="13">guardrails · supply-chain</text>

  <text x="660" y="190"><tspan class="ac">❯ </tspan><tspan class="fg">npx bats tests</tspan></text>
  <text x="676" y="212" class="ok">✓ 45 tests, 0 failures</text>
  <text x="1180" y="212" text-anchor="end" class="dim" font-size="13">dev-loop · verify</text>

  <text x="660" y="250"><tspan class="ac">❯ </tspan><tspan class="fg">/remember "prod db listens on 5433"</tspan></text>
  <text x="676" y="272" class="ask">? unverified, confirm first</text>
  <text x="1180" y="272" text-anchor="end" class="dim" font-size="13">memory-loop · save gate</text>

  <text x="660" y="310"><tspan class="ac">❯ </tspan><tspan class="fg">claude: "Done, all fixed!"</tspan></text>
  <text x="676" y="332" class="no">✗ no evidence cited, bounced</text>
  <text x="1180" y="332" text-anchor="end" class="dim" font-size="13">jev-gate · stop gate</text>

  <text x="660" y="368"><tspan class="ac">❯ </tspan><tspan class="fg">▍</tspan></text>
</g>
</svg>
